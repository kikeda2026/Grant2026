<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究参加同意確認 | 研究1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy:        #1A2340;
    --navy-mid:    #243055;
    --green:       #2EAA6E;
    --green-light: #EBF7F2;
    --green-dim:   #1E7A4E;
    --amber:       #E8973A;
    --amber-light: #FFF8EC;
    --gray:        #8A94A6;
    --gray-light:  #F4F6FA;
    --border:      #E2E8F0;
    --white:       #FFFFFF;
    --text:        #1A2340;
    --mono:        'DM Mono', monospace;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Sans JP', sans-serif; color: var(--text); background: var(--gray-light); line-height: 1.8; }

  nav { background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; height: 56px; position: sticky; top: 0; z-index: 100; }
  .nav-logo { color: var(--white); font-family: 'Noto Serif JP', serif; font-size: 0.85rem; text-decoration: none; letter-spacing: 0.05em; }
  .nav-back { color: rgba(255,255,255,0.7); font-size: 0.82rem; text-decoration: none; transition: color .2s; }
  .nav-back:hover { color: var(--green); }

  .page-header { background: var(--navy); padding: 36px 5% 32px; position: relative; overflow: hidden; }
  .page-header::after { content: 'CONSENT'; position: absolute; right: 3%; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: clamp(2rem, 6vw, 4.5rem); color: rgba(255,255,255,0.04); pointer-events: none; }
  .header-eyebrow { font-family: var(--mono); font-size: 0.7rem; color: var(--green); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.6rem; }
  .header-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.2rem, 3vw, 1.6rem); color: var(--white); margin-bottom: 0.5rem; }
  .header-sub { color: rgba(255,255,255,0.55); font-size: 0.83rem; max-width: 520px; line-height: 1.9; }

  main { max-width: 680px; margin: 0 auto; padding: 28px 5% 80px; }

  /* 研究概要カード */
  .summary-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 3px; padding: 1.4rem 1.6rem; margin-bottom: 1.2rem; }
  .summary-card h2 { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--green-light); display: flex; align-items: center; gap: 0.5rem; }
  .summary-card h2::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--green); border-radius: 2px; }
  .summary-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .summary-table tr { border-bottom: 1px solid var(--border); }
  .summary-table tr:last-child { border-bottom: none; }
  .summary-table th { width: 35%; padding: 0.55rem 0.7rem; background: var(--gray-light); font-weight: 700; color: var(--navy); font-size: 0.8rem; vertical-align: top; }
  .summary-table td { padding: 0.55rem 0.7rem; color: #4A5568; line-height: 1.7; }

  /* 同意項目 */
  .consent-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 3px; padding: 1.4rem 1.6rem; margin-bottom: 1.2rem; }
  .consent-card h2 { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; margin-bottom: 1rem; padding-bottom: 0.6rem; border-bottom: 2px solid var(--green-light); display: flex; align-items: center; gap: 0.5rem; }
  .consent-card h2::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--amber); border-radius: 2px; }

  .consent-item { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.75rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .consent-item:last-child { border-bottom: none; }
  .consent-item input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--green); margin-top: 0.15rem; cursor: pointer; }
  .consent-item label { font-size: 0.87rem; color: #4A5568; line-height: 1.7; cursor: pointer; flex: 1; }
  .consent-item.checked label { color: var(--navy); }
  .item-num { font-family: var(--mono); font-size: 0.7rem; color: var(--gray); background: var(--gray-light); padding: 0.1rem 0.4rem; border-radius: 2px; flex-shrink: 0; margin-top: 0.2rem; }

  /* 進捗 */
  .progress-label { font-size: 0.75rem; color: var(--gray); font-family: var(--mono); margin-bottom: 0.4rem; }
  .progress-bar-wrap { background: var(--border); border-radius: 99px; height: 5px; margin-bottom: 1.2rem; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--green); border-radius: 99px; transition: width .3s; }

  /* 送信エリア */
  .submit-area { background: var(--white); border: 1.5px solid var(--border); border-radius: 3px; padding: 1.4rem 1.6rem; text-align: center; }
  .submit-note { font-size: 0.82rem; color: #4A5568; line-height: 1.8; margin-bottom: 1.2rem; }
  .btn-submit { background: var(--green); color: var(--white); border: none; cursor: pointer; padding: 0.9rem 2.8rem; font-size: 0.92rem; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; letter-spacing: 0.08em; border-radius: 2px; transition: background .2s; }
  .btn-submit:hover { background: var(--green-dim); }
  .btn-submit:disabled { background: var(--gray); cursor: not-allowed; }

  /* 状態パネル */
  .state-panel { display: none; text-align: center; padding: 3rem 2rem; background: var(--white); border: 1.5px solid var(--border); border-radius: 3px; }
  .state-icon { font-size: 3rem; margin-bottom: 1rem; }
  .state-panel h2 { font-family: 'Noto Serif JP', serif; font-size: 1.3rem; margin-bottom: 0.8rem; }
  .state-panel.done h2 { color: var(--green); }
  .state-panel.already h2 { color: var(--amber); }
  .state-panel p { font-size: 0.88rem; color: #4A5568; line-height: 1.9; }
  .back-link { display: inline-block; margin-top: 1.4rem; color: var(--green); font-size: 0.85rem; text-decoration: none; font-weight: 700; }
  .next-info { background: var(--green-light); border-left: 3px solid var(--green); padding: 0.9rem 1.1rem; font-size: 0.83rem; color: #1A5C3A; margin-top: 1rem; text-align: left; border-radius: 2px; line-height: 1.8; }

  /* オーバーレイ */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(26,35,64,0.5); z-index: 200; align-items: center; justify-content: center; }
  .overlay.show { display: flex; }
  .overlay-box { background: var(--white); padding: 2rem 2.5rem; text-align: center; border-radius: 3px; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { background: #111827; padding: 1.2rem 5%; text-align: center; }
  footer p { font-size: 0.75rem; color: rgba(255,255,255,0.3); }

  @media (max-width: 600px) {
    .summary-card, .consent-card, .submit-area { padding: 1.1rem 1rem; }
    .summary-table th { width: 40%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <div class="spinner"></div>
    <p style="font-size:0.9rem; color:#4A5568;">送信中です…</p>
  </div>
</div>

<nav>
  <a href="index.html" class="nav-logo">研究1 参加者ページ</a>
  <a href="index.html" class="nav-back">← トップへ戻る</a>
</nav>

<div class="page-header">
  <p class="header-eyebrow">Informed Consent / 初日のみ</p>
  <h1 class="header-title">研究参加同意確認</h1>
  <p class="header-sub">研究への参加に同意していただくためのページです。初日に1回だけ実施してください。</p>
</div>

<main id="mainContent"></main>

<footer>
  <p>© 2026 池田研究室 ― 尚絅学院大学 心理部門　|　倫理審査承認番号：2026-002</p>
</footer>

<iframe id="gasIframe" name="gasIframe" style="display:none;"></iframe>

<script>
const GAS_URL       = 'https://script.google.com/macros/s/AKfycby5FYl7ruaqdoQvbxhCrUxUG8IMpxYHY6cUFwASDWxwplmTA49eOV6-24hgDD0grCSV/exec';
const ID_KEY        = 'study1_participant_id';

// 同意完了フラグは参加者IDに紐づけて管理する
function getConsentKey(pid) {
  return `study1_consent_done_${pid}`;
}

// 同意確認10項目
const CONSENT_ITEMS = [
  '研究の目的と意義について，研究担当者からの説明を受け，理解しました。',
  '研究への参加によって実施する測定・課題の内容（CGMセンサーの装着，スマートウォッチの装着，認知課題，質問紙への回答）について説明を受け，理解しました。',
  'CGMセンサーの装着に伴う皮膚への影響（かぶれ・かゆみ等）が生じる可能性について説明を受け，理解しました。',
  '質問紙（CES-D）への回答による心理的負担が生じる可能性について説明を受け，理解しました。',
  '本研究への参加は完全に任意であり，参加しないことによる不利益は一切生じないことを理解しました。',
  '参加に同意した後であっても，いつでも・理由を問わず参加を取りやめることができ，その場合も不利益は生じないことを理解しました。',
  '取得した個人情報（氏名・連絡先）は参加管理のみに使用され，研究データと分離して管理されることを理解しました。',
  '研究データはすべて匿名化（IDコード化）のうえ解析・保管され，個人が特定される形で公表されないことを理解しました。',
  '研究結果が，個人を特定しない形で学術論文・学会発表等として公表されることを理解しました。',
  '疑問・不安・苦情等が生じた場合の連絡先（研究責任者：池田和浩，尚絅学院大学 心理部門）について確認しました。',
];

function render() {
  const pid  = localStorage.getItem(ID_KEY);
  const main = document.getElementById('mainContent');

  // ID未設定
  if (!pid) {
    main.innerHTML = `
      <div class="state-panel already" style="display:block;">
        <div class="state-icon">🔒</div>
        <h2>参加者IDが未設定です</h2>
        <p>トップページで参加者IDを入力・保存してから戻ってきてください。</p>
        <a href="index.html" class="back-link">← トップページへ戻る</a>
      </div>`;
    return;
  }

  // 同意済み
  if (localStorage.getItem(getConsentKey(pid))) {
    main.innerHTML = `
      <div class="state-panel already" style="display:block;">
        <div class="state-icon">✅</div>
        <h2>同意確認は完了しています</h2>
        <p>
          参加者ID「<strong>${pid}</strong>」の同意確認はすでに完了しています。<br>
          トップページから各課題・測定に進んでください。
        </p>
        <a href="index.html" class="back-link">← トップページへ戻る</a>
      </div>`;
    return;
  }

  // 同意確認フォームを描画
  main.innerHTML = `
    <!-- 研究概要 -->
    <div class="summary-card">
      <h2>研究の概要</h2>
      <table class="summary-table">
        <tr><th>研究課題名</th><td>運動による血糖値変動の安定化が認知機能を介してうつ状態の改善に至る因果的媒介過程の検証</td></tr>
        <tr><th>研究責任者</th><td>池田 和浩（尚絅学院大学 心理部門）</td></tr>
        <tr><th>研究期間</th><td>令和8年4月〜令和10年12月</td></tr>
        <tr><th>参加期間</th><td>2週間（14日間）</td></tr>
        <tr><th>測定内容</th><td>血糖値モニタリング（CGM）・バイタル計測・認知課題・うつ傾向アンケート</td></tr>
        <tr><th>謝礼</th><td>全期間完了で2,000円相当</td></tr>
        <tr><th>問い合わせ先</th><td>research.ikeda@gmail.com（[AT]は@に変更してください）</td></tr>
      </table>
    </div>

    <!-- 同意確認項目 -->
    <div class="consent-card">
      <h2>同意確認事項</h2>
      <p style="font-size:0.84rem; color:#4A5568; margin-bottom:1rem;">
        以下の各項目を確認し，理解できた場合はチェックを入れてください。<br>
        すべての項目にチェックを入れてから同意ボタンが有効になります。
      </p>

      <p class="progress-label">確認済み：<span id="progressCount">0</span> / ${CONSENT_ITEMS.length} 項目</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width:0%"></div>
      </div>

      ${CONSENT_ITEMS.map((item, i) => `
        <div class="consent-item" id="item-wrap-${i+1}">
          <span class="item-num">${String(i+1).padStart(2,'0')}</span>
          <input type="checkbox" id="item${i+1}" onchange="onCheck()">
          <label for="item${i+1}">${item}</label>
        </div>
      `).join('')}
    </div>

    <!-- 送信エリア -->
    <div class="submit-area">
      <p class="submit-note">
        上記10項目すべてをご確認のうえ，同意される場合は下のボタンをタップしてください。<br>
        <strong>同意は任意です。同意しない場合も不利益は生じません。</strong>
      </p>
      <button class="btn-submit" id="submitBtn" onclick="submitConsent()" disabled>
        上記の内容に同意して参加する
      </button>
    </div>

    <!-- 完了パネル（初期非表示） -->
    <div class="state-panel done" id="donePanel">
      <div class="state-icon">✅</div>
      <h2>同意確認が完了しました</h2>
      <p>研究へのご参加ありがとうございます。</p>
      <div class="next-info">
        本日から14日間の研究が始まります。<br>
        トップページから各課題・測定に進んでください。<br>
        <strong>毎日の認知課題</strong>は忘れずに実施してください（約5分）。
      </div>
      <a href="index.html" class="back-link">← トップページへ戻る</a>
    </div>
  `;
}

function onCheck() {
  const checked = CONSENT_ITEMS.filter((_, i) =>
    document.getElementById(`item${i+1}`)?.checked
  ).length;
  document.getElementById('progressCount').textContent = checked;
  const pct = (checked / CONSENT_ITEMS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('submitBtn').disabled = (checked < CONSENT_ITEMS.length);

  // チェック済み項目のスタイルを更新
  CONSENT_ITEMS.forEach((_, i) => {
    const wrap = document.getElementById(`item-wrap-${i+1}`);
    if (wrap) {
      wrap.classList.toggle('checked', !!document.getElementById(`item${i+1}`)?.checked);
    }
  });
}

function submitConsent() {
  const pid = localStorage.getItem(ID_KEY);
  const now = new Date().toLocaleString('ja-JP');

  const payload = {
    タイプ:    '同意確認',
    参加者ID: pid,
    同意日時: now,
  };
  CONSENT_ITEMS.forEach((item, i) => {
    payload[`項目${i+1}`] = `確認済み：${item.substring(0, 20)}…`;
  });

  document.getElementById('overlay').classList.add('show');
  document.getElementById('submitBtn').disabled = true;

  const gasForm = document.createElement('form');
  gasForm.action  = GAS_URL;
  gasForm.method  = 'POST';
  gasForm.target  = 'gasIframe';
  gasForm.style.display = 'none';
  Object.entries(payload).forEach(([k, v]) => {
    const input = document.createElement('input');
    input.type  = 'hidden';
    input.name  = k;
    input.value = v;
    gasForm.appendChild(input);
  });
  document.body.appendChild(gasForm);

  setTimeout(() => {
    gasForm.submit();
    document.body.removeChild(gasForm);
    document.getElementById('overlay').classList.remove('show');

    // 同意完了フラグを参加者IDに紐づけて保存
    localStorage.setItem(getConsentKey(pid), now);

    // 完了パネルを表示
    document.querySelector('.summary-card').style.display  = 'none';
    document.querySelector('.consent-card').style.display  = 'none';
    document.querySelector('.submit-area').style.display   = 'none';
    document.getElementById('donePanel').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 2000);
}

window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
