    <script type="text/javascript">

    // ── GAS Integration (池田研究室 研究1) ──────────────────────────
    var GAS_URL = 'https://script.google.com/macros/s/AKfycby5FYl7ruaqdoQvbxhCrUxUG8IMpxYHY6cUFwASDWxwplmTA49eOV6-24hgDD0grCSV/exec';

    function sendResultsToGAS(outcomes, results) {
        var pid = localStorage.getItem('study1_participant_id') || '';
        var now_str = new Date().toLocaleString('ja-JP');

        // テスト試行のみ抽出（練習試行を除く，isHitが確定している試行のみ）
        var testTrials = (results || []).filter(function(t) {
            return t.type === 'test' && t.isHit !== null;
        }).map(function(t) {
            return {
                item:     t.item     !== undefined ? t.item     : '',
                isHit:    t.isHit    !== null       ? t.isHit    : '',
                nBack:    t.nBack    !== undefined ? t.nBack    : '',
                pressed:  t.pressed  !== undefined ? t.pressed  : '',
                correct:  t.correct  !== null       ? t.correct  : '',
                rt:       t.rt       !== null       ? t.rt       : '',
                state:    t.state    || ''
            };
        });

        // ── 集計データ送信 ──
        var summaryPayload = {
            'タイプ':            '2-back集計',
            '参加者ID':          pid,
            '実施日時':          now_str,
            'dprime':           outcomes.dprime      !== undefined ? outcomes.dprime      : '',
            'crit':             outcomes.crit        !== undefined ? outcomes.crit        : '',
            'hitRate':          outcomes.OEprop      !== undefined ? (1 - outcomes.OEprop) : '',
            'falseAlarmRate':   outcomes.CEprop      !== undefined ? outcomes.CEprop      : '',
            'meanRTc':          outcomes.meanRTc     !== undefined ? outcomes.meanRTc     : '',
            'medianRTc':        outcomes.medianRTc   !== undefined ? outcomes.medianRTc   : '',
            'sdRTc':            outcomes.sdRTc       !== undefined ? outcomes.sdRTc       : '',
            'cvRTc':            outcomes.cvRTc       !== undefined ? outcomes.cvRTc       : '',
            'accuracy':         outcomes.accuracy    !== undefined ? outcomes.accuracy    : '',
            'score':            outcomes.score       !== undefined ? outcomes.score       : '',
            'responseDevice':   outcomes.responseDevice !== undefined ? outcomes.responseDevice : '',
            'testVersion':      outcomes.testVersion !== undefined ? outcomes.testVersion : ''
        };
        postToGAS(summaryPayload);

        // ── 詳細データ送信（試行レベル JSON） ──
        if (testTrials.length > 0) {
            var detailPayload = {
                'タイプ':    '2-back詳細',
                '参加者ID': pid,
                '実施日時': now_str,
                'trials':   JSON.stringify(testTrials)
            };
            postToGAS(detailPayload);
        }
    }

    // showAlertにスペースキー対応を追加するラッパー 池田研究室 研究1で追加
    // このバージョンのTestMyBrain.jsのshowAlert()はボタンのクリック（onclick）にしか反応せず，
    // キーボードでの続行に対応していないため，別途キーボードリスナーを追加する
    var _showAlertKeyHandler = null;
    function showAlertKB(message, buttonText, callback, fontSize) {
        if (_showAlertKeyHandler) {
            document.removeEventListener('keydown', _showAlertKeyHandler);
            _showAlertKeyHandler = null;
        }
        showAlert(message, buttonText, callback, fontSize);
        if (!hasTouch) {
            _showAlertKeyHandler = function(e) {
                if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
                    e.preventDefault();
                    document.removeEventListener('keydown', _showAlertKeyHandler);
                    _showAlertKeyHandler = null;
                    callback();
                }
            };
            document.addEventListener('keydown', _showAlertKeyHandler);
        }
    }

    // 送信ごとに専用の使い捨てiframeを生成してPOST送信（CORS回避／複数送信の競合防止）
    // 池田研究室 研究1で改修：以前は共通のgasIframeを使い回しており，集計・詳細を連続送信すると
    // 一方の通信がキャンセルされることがあったため，送信のたびに新規iframeを作る方式に変更
    function postToGAS(payload) {
        var iframeName = 'gasIframe_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        var iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        var form = document.createElement('form');
        form.action  = GAS_URL;
        form.method  = 'POST';
        form.target  = iframeName;
        form.style.display = 'none';
        Object.keys(payload).forEach(function(key) {
            var inp = document.createElement('input');
            inp.type  = 'hidden';
            inp.name  = key;
            inp.value = payload[key];
            form.appendChild(inp);
        });
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        // 送信完了を待ってからiframeを片付ける（早すぎる削除は通信を妨げるため）
        setTimeout(function() {
            if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        }, 10000);
    }

    var item_options
     = ['A', 'B', 'C', 'D', 'E', 'F'];  // list of n-back item options
    var ch;                 			// timeouts chain
    var results = [];       			// array to store trials details and responses
    var outcomes = {};      			// object containing outcome variables

    var presentationTime;		 		// URL parameter: time (in ms) that each item is displayed for, default = 1000
    var ISI;		          			// URL parameter: inter-stimulus interval (in  ms), default = 500
    var numItems;	        			// URL parameter: number of items per sequence, default = 40
    var hitProp;    					// URL parameter: percentage of n-back occurrences, default = .25
    var numGoItemsTest;					// number of go items per sequence (test)
    var numNoGoItemsTest;				// number of no-go items per sequence (test)
    var numGoItemsPractice;				// number of go items per sequence (practice)
    var numNoGoItemsPractice;			// number of no-go items per sequence (practice)
    var nBack;							// URL parameter: n-back sequences to run
    var seed;              				// URL parameter: random generator seed
    var feedback;         				// URL parameter: whether or not to show feedback
    var practiceItems = 6;				// how many letters in practice sequence
    var totalPracticeAttempts = 0;		// how many practice attempts have been completed
    var maxPracticeAttempts = 10;		// maximum number of practice attempts before advancing 池田研究室 研究1で変更（元は3。累積ミス数のカウントのため，少ない値だと学習途中でテストへ進んでしまう問題があった）
    var feedbackDuration = 150;			// duration of feedback in ms (when feedback is present)
    var debug;         					// URL parameter: output to console
    var showresults;   					// URL parameter: if they want to show results in a popup window
    var autosave;      					// URL parameter: if they want to save data in a file automatically
    var filename;      					// URL parameter: filename for data
    var usage = "";    					// URL parameter: show usage
    var nopractice;						// URL parameter: should we skip the practice trials?
    var trialStart;						// variable for keeping track of times when trials start
    var trialCount = -1;				// variable to keep track of trial number
    var exampleSequences = [];			// example sequences for instructions
    var msg1;							// string specific to input device
    var just_saw_warning = false;		// variable to keep track of practice warning message state
    var last_event = now();				// variable used for debouncing
    var practice_feedback;				// feedback div during practice
    var firstrun;						// URL parameter: set to 'true' to run as part of practice.html's practice task (still practice — no GAS submission, continues to next practice step) — 池田研究室 研究1で追加
    var lastPracticeSequence = null;	// 直前の練習試行の文字列・ヒット位置（やり直し画面の説明表示用）— 池田研究室 研究1で追加
    
    function sample(lo, hi, n, replacement){
		// store output
		var res = [];
		
		// make vector of numbers we are sampling from
		var num_opts = [];
		for (var i = lo; i <= hi; i++)
		{
			num_opts.push(i);
		}
		
		//start sampling randomly
		for (var c = 0; c < n; c++)
		{
			var pos = sampleInt(0, num_opts.length - 1);
			var pick = num_opts[pos];
			res.push(pick);
			
			//cut selection from list if not replacement
			if (!replacement)
			{
				num_opts.splice(pos, 1);
			}
		}
		return(res);
	}
	
	function sampleInt(lo, hi)
	{
		var res = Math.floor(Math.random() * (hi - lo + 1)) + lo;
		return(res);
	}
	
	function showDemoSequence(sequence, count)
	{
		// show stimuli
		ch = chainTimeouts(
		function()

			getID("items").style.background = 'white';

		},

			{
				nextTrial();
			}
			else
			{
				showDemoSequence(sequence, count+1);
			}
		});
	}
	
	function ltqnorm (p)
    {
        /* Lower tail quantile for standard normal distribution function.

         This function returns an approximation of the inverse cumulative
         standard normal distribution function.  I.e., given P, it returns
         an approximation to the X satisfying P = Pr{Z <= X} where Z is a
         random variable from the standard normal distribution.

         The algorithm uses a minimax approximation by rational functions
         and the result has a relative error whose absolute value is less
         than 1.15e-9.

         Author:      Peter John Acklam

         http://home.online.no/~pjacklam/notes/invnorm/
         */

        /* Coefficients in rational approximations. */
        var a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02,
            1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];

        var b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02,
            6.680131188771972e+01, -1.328068155288572e+01];

        var c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00,
            -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];

        var d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00,
            3.754408661907416e+00];

        var LOW = 0.02425;
        var HIGH = 0.97575;

        var q, r;

        // errno = 0;

        if (p < 0 || p > 1)
        {
            // errno = EDOM;
            return 0.0;
        }
        else if (p === 0)
        {
            // errno = ERANGE;
            return Number.NEGATIVE_INFINITY; /* minus "infinity" */
        }
        else if (p === 1)
        {
            // errno = ERANGE;
            return Number.POSITIVE_INFINITY; /* "infinity" */
        }
        else if (p < LOW)
        {
            /* Rational approximation for lower region */
            q = Math.sqrt(-2*Math.log(p));
            return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
                ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
        }
        else if (p > HIGH)
        {
            /* Rational approximation for upper region */
            q  = Math.sqrt(-2*Math.log(1-p));
            return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
                ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
        }
        else
        {
            /* Rational approximation for central region */
            q = p - 0.5;
            r = q*q;
            return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q /
                (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
        }
    }
	
	function report(e)
    {
		if (e.repeat)
		{ 
			return;
		}
        e.preventDefault();
        e.stopPropagation();
        
        // if a second response comes in too quickly after a previous one,
		// ignore it (debounce with 50ms delay)
		// (this can happen when both touchstart and pointerdown are emitted
		// for the same response)
		var this_event = now();
		if (this_event - last_event < 50)
		{
			return;
		}
        last_event = this_event;
        
        
        // handle the response
        var whichTrial;

        if(e.type === "touchstart" ||
           e.type === "pointerdown" ||
           e.type === "keydown")
        {
            
            // log rt
            var responseTimeStamp = now();
            var responseTime = (responseTimeStamp - trialStart).round(2);
            
            if (responseTime <= 200)
            {
            	if (results[trialCount-1].pressed === 0) // assign to prior trial if no response to prior trial
            	{
            		whichTrial = trialCount - 1;
            		responseTime = (responseTimeStamp - results[whichTrial].stim_onset).round(2);
            	}
            	else if (results[trialCount].pressed === 0) // assign to current trial if already response to prior trial but not current
            	{
            		whichTrial = trialCount;
            	}
            	else // ignore response if response already assigned to both trials
            	{
            		return;
            	}
            }
            else
            {
            	if (results[trialCount].pressed === 0)
            	{
            		whichTrial = trialCount;
            	} 
            	else // ignore response if already assigned to this trial
            	{
            		return; 
            	}
            }
            
            results[whichTrial].rt = responseTime.round();
            results[whichTrial].pressed = 1;
			if(e.type === 'pointerdown') results[whichTrial].state = e.type + ('-'+e.pointerType);
			else results[whichTrial].state = e.type;
			results[whichTrial].response_timestamp = responseTimeStamp.round();
            
            //log accuracy and give feedback
            if (results[whichTrial].isHit === 1)
            {
            	// if practice, set up feedback
            	if (frame.type === "practice")
            	{
					practice_feedback.innerHTML = '正解！';
					setTimeout(function(){practice_feedback.innerHTML = ''},500);
                }
                
            	results[whichTrial].correct = 1;
            	if (feedback)
            	{
					getID("items").style.background = 'green';
					setTimeout(function(){getID("items").style.background = 'white';}, feedbackDuration);
            	}
            } 
            else 
            {
            	// if practice, set up feedback（池田研究室 研究1で追加：元は不正解時のテキスト表示がなかった）
            	if (frame.type === "practice")
            	{
					practice_feedback.innerHTML = '不正解';
					setTimeout(function(){practice_feedback.innerHTML = ''},500);
                }

            	results[whichTrial].correct = 0;
            	results[whichTrial].rt = responseTime;
            	if (feedback)
            	{
					getID("items").style.background = 'red';
					setTimeout(function(){getID("items").style.background = 'white';}, feedbackDuration);
            	}
            }
        }

    }
    
    // ── 文字系列をヒット位置を緑色でハイライトして表示するHTML生成（欠落画像の代替）池田研究室 研究1で追加 ──
    // 池田研究室 研究1で修正：<div>はライブラリのshowFrame()により自動的に非表示化されるため，
    // <span>とbrのみで構成するよう変更（divを一切使わない）
    function renderAnnotatedSequence(seq)
    {
    	if (!seq) return '';
    	var html = "<br><span style='font-size:22pt; letter-spacing:0.3em;'>";
    	for (var i = 0; i < seq.items.length; i++)
    	{
    		var color = (seq.hits[i] === 1) ? '#2EAA6E' : '#000000';
    		var weight = (seq.hits[i] === 1) ? 'bold' : 'normal';
    		html += "<span style='color:" + color + "; font-weight:" + weight + ";'>" + seq.items[i] + "</span>";
    	}
    	html += "</span><br>";
    	return html;
    }

    function showPracticeErrorMessage(h)
    {
    
    	var buttonText;
    	
    	totalPracticeAttempts++;
    	
    	if (h === 0) // miss
    	{
    		var msg = "おしい！<br>" +
    					(hasTouch ? "タップす" : "スペースキーを押す") +
    					"べきでした。<br>" +
    					"2つ前の文字と同じ文字が出たら，毎回<br>" +
    					(hasTouch ? "タップして" : "スペースキーを押して") +
    					"ください。<br><br>" +
    					"この系列では，緑色の文字のときに<br>反応するのが正解です。<br><br>" +
                        renderAnnotatedSequence(lastPracticeSequence);
    	}
    	else if (h === 1) // false alarm
    	{
    		var msg = "おしい！<br>" +
    					"2つ前の文字と同じ文字が出たときだけ<br>" +
    					(hasTouch ? "タップして" : "スペースキーを押して") +
    					"ください。<br><br>" +
    					"この系列では，緑色の文字のときに<br>反応するのが正解です。<br><br>" +
                        renderAnnotatedSequence(lastPracticeSequence);
    	
    	}
    	
    	// log that we just saw the warning to permit test to advance
    	just_saw_warning = true;
    	
    	if (totalPracticeAttempts < maxPracticeAttempts)
    	{
    		// reset frame sequence back to start of practice trials
    		frameSequence = resetSequenceState[nBack.indexOf(results[trialCount].nBack)].slice(0);
    		
    		buttonText =  (hasTouch ? "タップしてもう一度" : "スペースキーを押してもう一度");
    	}
    	else 
    	{
    		// remove any remaining practice frames
    		while (frameSequence[0].type === 'practice')
    		{
    			frameSequence.shift();
    		}
    		
    		buttonText =  (hasTouch ? "タップして続ける" : "スペースキーを押して続ける");
    	}
    	
    	showAlertKB(msg,
				 buttonText,
				 function ()
				 {
					 showFrame("null");
					 nextTrial();
				 },
				 '20pt');
    }

    // iterate through the frameSequence object
    // implementing stimulus presentation,
    // response collection and data management
    function nextTrial()
    {
    
    	// remove event listener (in case no response last test trial or incorrect practice)
		if(hasTouch)
		{
			if("ontouchend" in window)
				window.removeEventListener('touchstart',report,true);
			if(window.PointerEvent)
				window.removeEventListener('pointerdown',report,true);
		}
		else 
		{
			window.removeEventListener('keydown',report,true);
		}
		
    	// if practice and they got the last trial wrong, escape and show message
    	if (!just_saw_warning && results.length > 0 && results[trialCount].type == "practice" && totalPracticeAttempts < maxPracticeAttempts)
    	{
    		if ((results[trialCount].pressed === 1 && results[trialCount].isHit !== 1) ||
    			(results[trialCount].pressed === 0 && results[trialCount].isHit === 1))
    		{
    			showPracticeErrorMessage(results[trialCount].pressed);
    			return;
    		}
    	} 
    	else 
    	{
    		just_saw_warning = false;
    	}
    		
        // read the frame sequence one frame at a time
        frame = frameSequence.shift();
        if (frame)
        {
            // check if it's the startup frame
            if (frame.type === "begin") showAlertKB(frame.message,
                                                  (hasTouch ? "タップして説明を見る" : "スペースキーを押して説明を見る"),
                                                  function ()
                                                  {
                                                      showFrame("null");
                                                      nextTrial();
                                                  },
                                                  '20pt');

            // else if it's a message frame, show it
            else if (frame.type === "message")
			{  							
				showAlertKB(frame.message,
				 (hasTouch ? "タップして続ける" : "スペースキーを押して続ける"),
				 function ()
				 {
					 showFrame("null");
					 nextTrial();
				 },
				 '20pt');
            }
            // else if it's a message_start frame, show it
            else if (frame.type === "message_start")
			{  							
				showAlertKB(frame.message,
				 (hasTouch ? "タップしてテストを始める" : "スペースキーを押してテストを始める"),
				 function ()
				 {
					 showFrame("null");
					 nextTrial();
				 },
				 '20pt');
            }
            // else if it's a message_practice frame, show it
            else if (frame.type === "message_practice")
			{  							
				showAlertKB(frame.message,
				 (hasTouch ? "タップして練習を始める" : "スペースキーを押して練習を始める"),
				 function ()
				 {
					 showFrame("null");
					 nextTrial();
				 },
				 '20pt');
            }
            // handle sequence examples
            else if (frame.type === "example") 
            {
				
				// make sure item background is white
            	getID("items").style.background = 'white';
            	
            	// set the demo sequence
            	var this_demo_sequence = exampleSequences[frame.nBack - 1];
            	
            	// show the demo sequence
                showDemoSequence(this_demo_sequence, 0);
            }
            // deal with practice and test frames
            else
            {
           		//increase trial count
           		trialCount++;
           		 
            	// add to results object
            	results.push({
					type: frame.type, // one of practice or test
					trial: frame.trial_id,
					item: frame.item,
					isHit: frame.isHit,
					nBack: frame.nBack,
					rt: null,
					pressed: 0,
					state: '',
					correct: null
                });
                
                //set up initial accuracy value in case no response is made
                if (results[trialCount].isHit === 1)
                {
                	results[trialCount].correct = 0;
                } 
                else if (results[trialCount].isHit === 0)
                {
                	results[trialCount].correct = 1;
                }
                
                // show stimuli
                ch = chainTimeouts(
                function()
                {
                	//show item
                	getID("items").style.background = 'white';
                    getID("items").innerHTML = frame.item;
                    
                    // include practice feedback div if practice trial
                    if (frame.type === "practice")
                    {
                    	feedback.innerHTML = '';
                    	showFrame("items", "practice_feedback");
                    }
                    else
                    {
                    	showFrame("items");
                    }
                    
                    trialStart = now();
                    results[trialCount].stim_onset = trialStart.round();
                    results[trialCount].response_timestamp = null;
                    //add event listener
                    if(hasTouch)
					{
						if("ontouchend" in window)
							window.addEventListener('touchstart',report,true);

						// to accomodate for pen input we need to listen to 'pointerdown';
						// on hybrid windows devices and edge browser
						// pen is reported as pointerdown.pen
						if(window.PointerEvent)
							window.addEventListener('pointerdown',report,true);
					}
					else
					{
						window.addEventListener('keydown',report,true);
					}
                },
                presentationTime,
                function()
                {
                     getID("items").innerHTML = "";
                },
                ISI,
                function()
                {
                    nextTrial();
                });
            }
        }
        // else the sequence is empty, we are done!
        else
        {
            //compute outcomes
             var tmp1, tmp2, tmp3, tmp4;
             
            //total go and nogo trials across the entire test (numItems * number of n-back conditions)
            var nGoTotal = numGoItemsTest * nBack.length;
            var nNoGoTotal = numNoGoItemsTest * nBack.length;

            // all test trials (excluding practice and first N trials)
            tmp1 = results.filter(function( obj )
            {
                return obj.type === 'test' &&
                       obj.isHit !== null;
            });
            
            // correct trials
            tmp2 = tmp1.filter(function( obj ) {return obj.correct === 1;});
            
            // correct go trials (i.e., hits or true positives)
            tmp3 = tmp2.filter(function( obj ) {return obj.isHit === 1;});

            // compute commission errors (go response to no-go trial)
            // and omission errors (no-go response to go trial)
            var tmp_incorrect = tmp1.filter(function( obj ) {return obj.correct === 0;});
            var CE = tmp_incorrect.filter(function( obj ) {return obj.isHit === 0;});
            var OE = tmp_incorrect.filter(function( obj ) {return obj.isHit === 1;});
            var CEprop = CE.length / nNoGoTotal;
            var OEprop = OE.length / nGoTotal;

            // compute d' and bias
            // (avoid infinity by adding or subtracting 0.5 error when
            //  pHit and/or pFA are 0 or 1)
            // pHit = 1 - OEprop
            // pFA =ZCEprop
            // d' = norminv(pHit) - norminv(pFA)
            // crit = (-1 * (norminv(pHit) + norminv(pFA)) / 2
            var pFA = (CE.length === 0) ? (0.5 / nNoGoTotal):
                       (CE.length === nNoGoTotal) ?  (1 - (0.5 / nNoGoTotal)):
                       CEprop;
            var pHit = (OE.length === nGoTotal) ? (0.5 / nGoTotal):
                      (OE.length === 0) ? (1 - (0.5 / nGoTotal)):
                      1 - OEprop;
            var zHit = ltqnorm(pHit);
            var zFA = ltqnorm(pFA);

            // get response device from trials where a response was made
           	tmp4 = results.filter(function( obj )
            {
                return obj.type === 'test' &&
                       obj.pressed === 1;
            });
            tmp4 = tmp4.length ? tmp4[0].state : 'none';
            tmp4 = /key/i.test(tmp4) ? 'keyboard' :
                   /touch/i.test(tmp4) ? 'touch' :
                   /mouse/i.test(tmp4) ? 'mouse' :
                   /pen/i.test(tmp4) ? 'pen' :
                   'unknown';

            outcomes.accuracy = (tmp2.length / tmp1.length).round(4);
            outcomes.meanRTc = tmp3.length ? tmp3.pluck('rt').average().round(4) : null;
            outcomes.medianRTc = tmp3.length ? tmp3.pluck('rt').median().round(4) : null;
            outcomes.sdRTc = tmp3.length > 1 ? tmp3.pluck('rt').sd().round(4) : null;
            outcomes.cvRTc = tmp3.length > 1 ? outcomes.sdRTc / outcomes.meanRTc : null;
			if (outcomes.cvRTc !== null)       
			{
				outcomes.cvRTc = outcomes.cvRTc.round(4);
			}    
            outcomes.CEprop = CEprop.round(4);
            outcomes.OEprop = OEprop.round(4);
            outcomes.dprime = (zHit - zFA).round(4);
            outcomes.crit = ((-1 * (zHit + zFA)) / 2).round(4);
            outcomes.score = (100*Math.sqrt((1-CEprop)*(1-OEprop))).round(4);
            outcomes.responseDevice = tmp4;
            outcomes.testVersion = testVersion;
    
			
            // if debugging, output to console
            if(debug === "true") logResults([outcomes], 'cum');

            // we either save locally or to the server
            if(showresults === "true" || autosave === 'true' || filename)
            {
                // append outcomes to results
                outcomes.type = 'summaryScores';
                results.push(outcomes);

                showAlert("Your score is " + outcomes.score + ".<br>" +
                          "<br>The test is over.<br>" +
                          "Thank you for participating!<br><br>",
                          "",
                          null,
                          '20pt');

                setTimeout(function()
                {
                    if(filename === false) filename = "NBackResults.csv";
                    tmbSubmitToFile(results,filename,autosave);
                },2000);
            }
            else if (firstrun === 'true')
            {
                // ── 練習課題ページ内のテスト（あくまで練習）：GAS送信なし，完了フラグのみローカル保存 ── 池田研究室 研究1で追加
                localStorage.setItem('study1_practice_nback_done', 'true');

                showAlert("2-backの練習課題が完了しました！<br><br>" +
                          "お疲れさまでした。<br>" +
                          "これで3つの課題の練習がすべて終わりました。<br><br>",
                          "",
                          null,
                          '20pt');

                setTimeout(function()
                {
                    window.location.href = '../practice.html?step=4';
                }, 3000);
            }
            else
            {
                // ── GASへデータ送信 ── 池田研究室 研究1で改修（元はtmbSubmitToServerでTestMyBrain側へ送信していた）
                sendResultsToGAS(outcomes, results);

                showAlert("課題が完了しました。<br><br>" +
                          "ありがとうございました。<br>" +
                          "自動的に画面が切り替わります…<br><br>",
                          "",
                          null,
                          '20pt');

                setTimeout(function()
                {
                    window.location.href = '../cognitive.html';
                }, 3000);
            }
        }
    }

    // generate the frameSequence object,
    // where each object's element codes the parameters
    // for a single trial/frame
    //"For example, you might see the<br>following sequence of letters:<br><br>" + 
     //                         "C...A...B...B...D...C<br><br>"), 
    function setFrameSequence()
    {
        var testMessage, i;
        
        msg1 = ((hasTouch) ?
                           'tap the screen' :
                           'press and release the spacebar');
        msg1_cap = ((hasTouch) ?
                           'Tap the screen' :
                           'Press and release the spacebar');
        
        
        // nback-specific instructions
        if (nBack.length === 1)
        {
			var instuct_n1a = "<h2>説明：</h2>";
			var instuct_n2a = "<h2>説明：</h2>";
			var instruct_n2b = "";

        else if (nBack.length === 2 && Math.min.apply(Math, nBack) === 1)

        var instructions = [];
        //1-back instructions
        instructions[0] = [(instuct_n1a +

                              "Click below to see an example.<br><br>"),
                              //new instruction page//
                              ("EXAMPLE"),
                              //new instruction page//
                              ("<h2>Instructions:<br></h2>" +
                              "Your goal is to " + msg1 + "<br>when the letter on the screen is " + 
                              "the same<br>as the letter that appeared <b>immediately before it.</b><br><br>"),
                               //new instruction page//
                              ("<h2>Instructions:</h2>" +
                              "The letters you just saw are listed below.<br><br>" + 
                              "With this letter sequence,d<br>" + msg1 + " when<br>" +
                              "the letter B appears the second time,<br>" + 
                              "because a B also appeared <br>1 letter before.<br><br>" + 
                              "<img src='images/back1_example1.png' alt='Example'><br><br>"),
                              //new instruction page//
                              ("<h2>Instructions:</h2>" +
                              "Below is another example sequence.<br><br>" +  
                              msg1_cap + "<br>for all the letters in green below.<br><br>" + 
                              "For each green letter, the same letter<br>"  + 
                              "also appeared 1 letter before.<br><br>" +
                              "<img src='images/back1_example2.png' alt='Example'><br><br>")];
        //2-back instructions（池田研究室 研究1で日本語化。欠落画像は実際のデモ系列から生成したHTMLに置き換え）
        instructions[1] = [(instuct_n2a +
                              "文字が1つずつ<br>表示されます。<br><br>" +
                              "下のボタンで例を見てみましょう。<br><br>"),
                               //new instruction page//
                              ("EXAMPLE"),
                               //new instruction page//
                              ("<h2>説明：</h2>" +
                              instruct_n2b + "画面に表示された文字が，<br>" +
                              "<b>2つ前に表示された文字と同じ</b>ときに<br>" +
                              (hasTouch ? "タップして" : "スペースキーを押して") + "ください。<br><br>"),
                               //new instruction page//
                              ("<h2>説明：</h2>" +
                              "先ほどの文字列は，以下の通りです。<br>" + 
                              "<br><span style='font-size:20pt; letter-spacing:0.3em;'>" +
                              "<span>C</span><span>A</span><span>B</span>" +
                              "<span style='color:#2EAA6E; font-weight:bold;'>A</span>" +
                              "<span>D</span><span>C</span></span><br>" +
                              "2番目のAが出たときに<br>" +
                              (hasTouch ? "タップして" : "スペースキーを押して") + "ください。<br>" +
                              "2つ前の文字も同じAだったからです。<br><br>"),
                              //new instruction page//
                              ("<h2>説明：</h2>" +
                              "別の例を見てみましょう。<br>" +
                              "<br><span style='font-size:20pt; letter-spacing:0.3em;'>" +
                              "<span>B</span><span>E</span><span>C</span>" +
                              "<span style='color:#2EAA6E; font-weight:bold;'>E</span>" +
                              "<span>D</span>" +
                              "<span style='color:#2EAA6E; font-weight:bold;'>E</span></span><br>" +
                              "下の緑色の文字のときに，<br>すべて" +
                              (hasTouch ? "タップして" : "スペースキーを押して") + "ください。<br>" +
                              "緑色の文字はどれも，2つ前に<br>同じ文字が表示されています。<br><br>")];
        
        // messages（池田研究室 研究1で日本語化）
        testMessage =
        {
            "begin": ("<h2>2-backタスク</h2>" +
                      "<img src='images/nback.gif'><br><br>")
        };

        
        // opening frame 
        frameSequence.push(
			{
				type: "begin",
				message: testMessage.begin,
				item: "",
				isHit: "",
				nBack: "",
				trial_id: ""
			}
		);
        
        // set up n-back stim
		var new_item;
		var pre_item;
		var isHit;
		
		for (var n = 0; n < nBack.length; n++)
		{
			
			//this n-back value
			var nCond = nBack[n];
			
			
			if (!nopractice)
			{
				//add instructions to the frames chain
				for (i = 0; i < instructions[nCond-1].length; i++)
				{
					if (instructions[nCond-1][i].indexOf('EXAMPLE') != -1)
					{
						var this_type = 'example';
					} 
					else 
					{
						var this_type = 'message';
					}
				
					frameSequence.push(
						{
							type: this_type,
							message: instructions[nCond-1][i],
							item: "",
							isHit: "",
							nBack: nCond,
							trial_id: ""
						});
				}
			}
			
			//loop for practice and test trials
			if (nopractice)
			{
				p0 = 1;
			} 
			else 
			{
				p0 = 0;
			}
			
			for (var pt = p0; pt <= 1; pt++)
			{
				if (pt === 1) // test
				{
					var sequence_items = numItems;
					var numGoItems = numGoItemsTest;
					var msg = "よくできました！続けてテストを行います。<br><br>ここからは文字の系列が長くなり，" +
					 			"正誤のフィードバックは表示されません。<br><br>";
					var this_type = 'test';
					var this_message_type = 'message_start';
				} 
				else // practice
				{
					var sequence_items = practiceItems;
					var numGoItems = numGoItemsTestPractice;
					var msg = "練習してみましょう！<br><br>";
					var this_type = 'practice';
					var this_message_type = 'message_practice';
				}
			
			
				// set the RNG based on seed and this nCond value
				// this results in sequence always being the same for each seed + n-back value,
				// regardless of other n-back sequences being completed by the participant
				// (e.g., 3-back sequence will be the same when presented alone and when 
				// presented with 2-back condition)
				
				if (pt === 0) // practice
				{
					var this_seed = seed + '_N' + nCond + '_' + pt; //make unique seed for practice
				}
				else // test
				{
					var this_seed = seed + '_N' + nCond; //make unique seed for practice
				}
				Math.seedrandom(this_seed);
			
				// empty lists for items and hit locations (1/0)
				var item_list = [];
				var hit_list = [];
							
				// randomly select locations of hit items
				var hit_locations = sample(nCond, sequence_items + nCond - 1, numGoItems, false);
			
				for (var i = 0; i < sequence_items + nCond; i++)
				{
					var trial_opts = item_options.slice(0);
					if (i === 0) //first item
					{
						new_item = trial_opts[sampleInt(0, trial_opts.length - 1)];
						isHit = null;
					} 
					else if (i < nCond) //items that occur before an n-back hit is possible
					{
						//remove previous item as an option
						trial_opts.splice(trial_opts.indexOf(prev_item),1);
						new_item = trial_opts[sampleInt(0, trial_opts.length - 1)];
						isHit = null;
					} 
					else //items can now be n-back hits
					{ 
						var nback_item = item_list[i - nCond];
						if (hit_locations.indexOf(i) === -1) //not an n-back hit location
						{
							var trial_opts = item_options.slice(0);
							//remove n-back item as an option
							trial_opts.splice(trial_opts.indexOf(nback_item),1);
							//remove previous item as an option
							trial_opts.splice(trial_opts.indexOf(prev_item),1);
							//if next item is a hit location and nCond > 1, don't let that item occur now
							if (hit_locations.indexOf(i + 1) !== -1 && nCond > 1)
							{
								var next_n_back = item_list[i + 1 - nCond];
								trial_opts.splice(trial_opts.indexOf(next_n_back),1);
							}
							//select new item
							new_item = trial_opts[sampleInt(0, trial_opts.length - 1)];
							isHit = 0;
					
						}
						else //an n-back hit location
						{
							new_item = nback_item;
							isHit = 1;
						}
					}
					hit_list.push(isHit);
					item_list.push(new_item);
					prev_item = new_item;
				}
				
				// ── 練習ブロックの系列を保存（やり直し画面での表示用）池田研究室 研究1で追加 ──
				if (pt === 0)
				{
					lastPracticeSequence = { items: item_list.slice(0), hits: hit_list.slice(0) };
				}
				
				
				//add instruction message frames
				if (nCond === 1)
				{ 
					var txt = '直前に';
				} else {
					var txt = nCond + '文字前に';
				}
			
				var msg2 = ((hasTouch) ?
						   '画面をタップして' :
						   'スペースキーを押して');
				
				if (!nopractice)
				{
					frameSequence.push(
							{
								type: this_message_type,
								message:    msg + txt + "表示された文字と<br>" +
											"<b>同じ文字</b>が表示されたら，<br>毎回" + msg2 + "答えてください。<br><br>" +
											"それ以外のときは<br>" + (hasTouch ? "タップしないで" : "何も押さないで") + "ください。<br><br>",
								item: '',
								isHit: '',
								nBack: nCond,
								trial_id: ""
							});
						
					var msg_verb = ((hasTouch) ?
							   'タップする' :
							   'キーを押す');
						   
					if (feedback)
					{
						frameSequence.push(
							{
								type: "message",
								message:    '正しく' + msg_verb + 'と，<br>緑色の四角が表示されます。<br><br>' + 
											"<span style='display:inline-block; width:120px; height:120px; background:#2EAA6E;'></span><br><br>",
								item: '',
								isHit: '',
								nBack: nCond,
								trial_id: ""
							});
						frameSequence.push(
							{
								type: this_message_type,
								message:    '誤って' + msg_verb + 'と，<br>赤色の四角が表示されます。<br><br>' + 
											"<span style='display:inline-block; width:120px; height:120px; background:#D9534F;'></span><br><br>",
								item: '',
								isHit: '',
								nBack: nCond,
								trial_id: ""
							});
					 
					}
            	} 
            	else // single instruction frame when practice is skipped
            	{
					frameSequence.push(
							{
								type: "message_start",
								message:    txt + "表示された文字と<br>" +
											"<b>同じ文字</b>が表示されたら，<br>毎回" + msg2 + "答えてください。<br><br>" +
											"それ以外のときは<br>" + (hasTouch ? "タップしないで" : "何も押さないで") + "ください。<br><br>",
								item: '',
								isHit: '',
								nBack: nCond,
								trial_id: ""
							});
            	} 
					
				//add n-back sequence frames
				for (var i = 0; i < sequence_items + nCond; i++)
				{
					frameSequence.push(
							{
								type: this_type,
								message: '',
								item: item_list[i],
								isHit: hit_list[i],
								nBack: nCond,
								trial_id: this_type + (i+1)
							});
				}
			}
        }
        
        //set up frame reset sequences for missed practice trials
        // 池田研究室 研究1で修正：元は message.indexOf('practice!') で英語文言を検索していたが，
        // 日本語化により該当文字列が消え，練習リセットが機能しなくなっていたため，type判定に変更
        if (!nopractice)
		{
			var practice_frame_start = [];
			for (r = 0; r < frameSequence.length; r++)
			{
				if(frameSequence[r].type === 'message_practice')
				{
					practice_frame_start.push(r+1);
				}
			}
			for (r = 0; r < practice_frame_start.length; r++)
			{
				resetSequenceState.push(frameSequence.slice(practice_frame_start[r]));
			}
        }
        
        // start the trial sequence
        nextTrial();
    }

                "<i>input=testInput.txt</i> -- image pairs input file<br>" +
                "<i>debug=true</i> -- outputs trial by trial info to the console<br>" +
                "<i>showresults=true</i> -- allows to save results locally in a file<br>" +
                "<i>autosave=true</i> -- will attempt to save results automatically to file<br>" +
                "<i>filename=subject1.csv</i> -- the filename to save results to<br>" +
                "<i>presentationTime=1000</i> -- time (in ms) that each item is displayed for<br>" +
                "<i>ISI=500</i> -- inter-stimulus interval (in  ms)<br>" +
                "<i>numItems=32</i> -- number of items per sequence<br>" +
                "<i>hitProp=.25</i> -- percentage of items that are n-back occurrences<br>" +
                "<i>nBack=[2]</i> -- n-back sequences to run (default = [1,2])<br>" +
                "<i>feedback=false</i> -- whether to show feedback after responses (default = false)<br>" +
                "<i>nopractice=false</i> -- whether to skip instructions and practice trials (default = false)<br>" +
                "<i>seed=1</i> -- seed for generating random sequences<br>" +
                "<i>help</i> -- print this message");
            return;
        }

        // check if this is a debug session
        debug = getUrlParameters("debug", "", true);

        // check if they want to load results in a new page when the test is over,
        // if data is to be saved automatically to a file and the filename
        showresults = getUrlParameters("showresults", "", true);
        autosave = getUrlParameters("autosave", "", true);
        filename = getUrlParameters("filename", "", true);

        // firstrun=true: 練習課題ページ内のテスト（あくまで練習）。GAS送信なし，完了後は次の練習ステップへ 池田研究室 研究1で追加
        firstrun = getUrlParameters("firstrun","",true);
        if (!firstrun) firstrun = 'false';
        
        // get the nback conditions
        nBack = getUrlParameters("nback","",true);
        try
        {	
        	if (!nBack)
        	{
        		nBack = [2];
        	} else {
        		nBack = JSON.parse(nBack);
        	}
        }
        catch
        {
			showAlert("Invalid nback URL parameter:<br><br>"+
					  "N-Back conditions must be separated by commas <br>" +
					  "and contained within brackets. For example:<br><br>" + 
					  "&nback=[2,3]",
					  "",
					  null,
					  '20pt');
			return;
        }
        
        // set the random seed
        seed = getUrlParameters("seed","",true);
        if(!(seed = parseInt(seed))) seed = 1;
        
        // get presentationTime url parameter
        presentationTime = getUrlParameters("presentationTime","",true);
        if(!(presentationTime = parseInt(presentationTime))) presentationTime = 1000;
        
        // get ISI url parameter
        ISI = getUrlParameters("ISI","",true);
        if(!(ISI = parseInt(ISI))) ISI = 500;
        
        // get numItems url parameter
        numItems = getUrlParameters("numItems","",true);
        if(!(numItems = parseInt(numItems))) numItems = 32;
        
        // get hitProp url parameter
        hitProp = getUrlParameters("hitProp","",true);
        if(!(hitProp = parseFloat(hitProp))) hitProp = .25;
        
        // get feedback url parameter
        feedback = getUrlParameters("feedback","",true);
        if(feedback === 'true')
        {
        	feedback = true;
        } 
        else if (!feedback || feedback === 'false')
        {
        	feedback = false;
        } 
        else 
        {
        	showAlert("Error: Invalid value for url parameter 'feedback'<br><br>" +
                      "Must be 'true' or 'false'<br><br>",
                       "",
                       null,
                       '20pt');
            return;
        }
        
        // practice feedback div
        practice_feedback = getID('practice_feedback');
        
        // get nopractice url parameter
        nopractice = getUrlParameters("nopractice","",true);
        if(nopractice === 'true')
        {
        	nopractice = true;
        } 
        else if (!nopractice || nopractice === 'false')
        {
        	nopractice = false;
        } 
        else 
        {
        	showAlert("Error: Invalid value for url parameter 'nopractice'<br><br>" +
                      "Must be 'true' or 'false'<br><br>",
                       "",
                       null,
                       '20pt');
            return;
        }
        
        
        // determine number of go and no-go items per sequence based on URL input
        numGoItemsTest = Math.round(hitProp*numItems);	//number of go items per test sequence
    	numNoGoItemsTest = numItems -  numGoItemsTest;	//number of no-go items per test sequence
    	numGoItemsTestPractice = Math.round(hitProp*practiceItems);	//number of go items per test sequence
    	numNoGoItemsTestPractice = practiceItems -  numGoItemsTestPractice;	//number of no-go items per test sequence
    	
    	// set up example sequences
    	exampleSequences[0] = ['C','A','B','B','D','C'];
    	exampleSequences[1] = ['C','A','B','A','D','C'];
        
        // set the test version
        testVersion = scriptName.replace(/\.[^/.]+$/, "");

        // disable spurious user interaction
        disableSelect();
        disableRightClick();
        disableDrag();
        disableDoubleTapZoom();

        // add appropriate meta viewport for scaling
        setMobileViewportScale(600,600);
        
        // preload images and set frame sequence
        // 池田研究室 研究1：欠落画像7点はHTML/CSSによる動的表示に置き換えたため，プリロード対象から除外
        imagePreLoad(["images/nback.gif"],
                     {pipeline: false, callBack: setFrameSequence});
        
    }
